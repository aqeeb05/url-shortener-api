<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register - URL Shortener</title>
  <style>
    * { box-sizing: border-box; font-family: sans-serif; }
    body { background: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: #1e293b; padding: 2rem; border-radius: 8px; width: 340px; text-align: center; }
    input { width: 100%; padding: 12px; margin: 8px 0; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 6px; }
    button { width: 100%; padding: 12px; background: #0284c7; border: none; color: white; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    button:hover { background: #0369a1; }
    a { color: #38bdf8; text-decoration: none; font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Create Account</h2>
    <form id="regForm">
      <input type="text" id="name" placeholder="Full Name" required />
      <input type="email" id="email" placeholder="Email" required />
      <input type="password" id="password" placeholder="Password" required />
      <button type="submit">Register</button>
    </form>
    <p id="msg" style="margin-top:12px; font-size:0.9rem;"></p>
    <br>
    <a href="login.html">Already have an account? Log in</a>
  </div>

  <script>
    const API_BASE = 'http://localhost:5000';
    
    document.getElementById('regForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const msg = document.getElementById('msg');

      try {
        const res = await fetch(`${API_BASE}/api/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });
        const data = await res.json();
        
        if (res.ok) {
          msg.style.color = '#4ade80';
          msg.textContent = 'Account created! Redirecting to login...';
          setTimeout(() => window.location.href = 'login.html', 1500);
        } else {
          msg.style.color = '#f87171';
          msg.textContent = data.error || 'Registration failed';
        }
      } catch (err) {
        msg.style.color = '#f87171';
        msg.textContent = 'Server error. Is your backend running?';
      }
    });
  </script>
</body>
</html>
