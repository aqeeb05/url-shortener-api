<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL Shortener</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: #1e293b;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 500px;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
      color: #38bdf8;
      text-align: center;
    }

    p.subtitle {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 24px;
      text-align: center;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    input[type="url"] {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #334155;
      border-radius: 8px;
      background: #0f172a;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="url"]:focus {
      border-color: #38bdf8;
    }

    button {
      padding: 12px;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #0369a1;
    }

    button:disabled {
      background: #475569;
      cursor: not-allowed;
    }

    .result-box {
      margin-top: 24px;
      padding: 16px;
      background: #0f172a;
      border-radius: 8px;
      border: 1px solid #334155;
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    .result-link {
      color: #38bdf8;
      font-size: 1.1rem;
      word-break: break-all;
      text-decoration: none;
      font-weight: 600;
    }

    .copy-btn {
      background: #10b981;
    }

    .copy-btn:hover {
      background: #059669;
    }

    .error-msg {
      margin-top: 16px;
      color: #f87171;
      font-size: 0.9rem;
      text-align: center;
      display: none;
    }
     .Dashboard { background: #10b981; 
      padding: 12px 24px; 
      border: none; 
      border-radius: 6px; 
      color: white; 
      cursor: pointer; 
      font-weight: bold; 
      margin-top: 20px; }
    .Dashboard:hover { 
      background: #10b981b9; 
    }
    .back-link{
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #38bdf8;
      text-decoration: none;
      font-size: 0.9rem;
      margin-bottom: 20px;
    }
    .back-link svg{
      stroke: #38bdf8;
    }
  </style>
</head>
<body>

  <div class="container">
  <a href="dashboard.html" class="back-link">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Back to Dashboard
        </a>
    <h1>URL Shortener</h1>
    <p class="subtitle">Paste a long link to generate a short URL</p>

    <form id="shortenForm" class="input-group">
      <input 
        type="url" 
        id="longUrl" 
        placeholder="https://example.com/very-long-url-path" 
        required 
      />
      <button type="submit" id="submitBtn">Shorten Link</button>
    </form>

    <p id="errorMsg" class="error-msg"></p>

    <div id="resultBox" class="result-box">
      <a id="shortUrl" class="result-link" target="_blank"></a>
      <button id="copyBtn" class="copy-btn">Copy to Clipboard</button>
    </div>
  </div>


  <script>
    const form = document.getElementById('shortenForm');
    const longUrlInput = document.getElementById('longUrl');
    const submitBtn = document.getElementById('submitBtn');
    const resultBox = document.getElementById('resultBox');
    const shortUrlLink = document.getElementById('shortUrl');
    const copyBtn = document.getElementById('copyBtn');
    const errorMsg = document.getElementById('errorMsg');
    
    const API_BASE = 'http://localhost:5000';

    // Check if user is logged in
async function checkAuth() {
  
  try {
    const res = await fetch(`${API_BASE}/api/dashboard`, {
      method: 'GET',
      credentials: 'include'
    });
    if (res.status === 401) {
      // Not logged in, redirect to login
      window.location.href = 'login.html';
    }
  } catch (err) {
    console.error('Auth check failed:', err);
  }
}

// Run auth check on page load
checkAuth();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const longUrl = longUrlInput.value.trim();
      errorMsg.style.display = 'none';
      resultBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Shortening...';

      try {
        const response = await fetch(`${API_BASE}/api/shorten`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          credentials:'include',
          body: JSON.stringify({ longUrl: longUrl })
        });

        console.log('Response Status:', response.status); // Logs HTTP status code (e.g., 200, 401, 404, 500)

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || `Server error: ${response.status}`);
        }

        // Adjust 'data.shortUrl' according to your API response key
        shortUrlLink.href = data.shortUrl;
        shortUrlLink.textContent = data.shortUrl;
        resultBox.style.display = 'flex';

      } catch (err) {
        errorMsg.textContent = err.message || 'Something went wrong. Is server running?';
        errorMsg.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Shorten Link';
      }
    });

    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(shortUrlLink.href);
      copyBtn.textContent = 'Copied!';
      setTimeout(() => {
        copyBtn.textContent = 'Copy to Clipboard';
      }, 2000);
    });
  </script>
</body>
</html>
